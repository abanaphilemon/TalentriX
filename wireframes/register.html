<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TalentriX — Register Page Wireframe</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;">

  <div style="width:100%;max-width:440px;">

    <!-- Brand -->
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:24px;">
      <div style="width:36px;height:36px;border-radius:9px;background:var(--text);display:flex;align-items:center;justify-content:center;">
        <span style="color:#fff;font-size:16px;">✦</span>
      </div>
      <span style="font-weight:800;font-size:16px;">TalentriX</span>
    </div>

    <!-- Card -->
    <div style="background:var(--surface);border-radius:20px;padding:32px;box-shadow:0 12px 40px rgba(0,0,0,.1);">

      <!-- Optional hub-link banner -->
      <div class="block" style="height:42px;border-width:1px;border-radius:10px;margin-bottom:20px;font-size:11px;">
        🔗  You're joining a talent pool through an invited link.
      </div>

      <h2 style="font-size:22px;font-weight:800;margin-bottom:4px;">Create your account</h2>
      <p style="font-size:13px;color:var(--muted);margin-bottom:24px;">Register as a job seeker.</p>

      <!-- Fields -->
      <div style="display:flex;flex-direction:column;gap:14px;">
        <div class="wf-field">👤  Full Name</div>
        <div class="wf-field">📧  Email</div>
        <div class="wf-field">🔒  Password</div>
        <div class="wf-field">🔒  Confirm Password</div>
      </div>

      <div class="wf-btn wf-btn-primary" style="margin-top:20px;">Create Account  →</div>

      <p style="text-align:center;font-size:11px;color:var(--muted);margin-top:20px;">
        Already have an account? <u style="font-weight:600;">Go to home</u>
      </p>
    </div>
  </div>

</body>
</html>
