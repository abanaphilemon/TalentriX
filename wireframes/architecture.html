<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TalentriX — Architecture</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #fff; color: #000; padding: 40px; }

    .title { text-align: center; font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
    .sub { text-align: center; font-size: 12px; color: #888; font-weight: 500; margin: 4px 0 36px; }

    .canvas {
      width: 820px; margin: 0 auto;
      display: flex; flex-direction: column; align-items: center;
    }

    /* ── Simple boxes ── */
    .box {
      border: 3px solid #000; border-radius: 12px;
      padding: 16px 28px; text-align: center;
      background: #fff; min-width: 220px;
    }
    .box-title { font-size: 16px; font-weight: 800; }
    .box-desc { font-size: 11px; color: #666; font-weight: 500; margin-top: 4px; }
    .box-dark { background: #000; color: #fff; border-color: #000; }
    .box-dark .box-desc { color: #bbb; }

    /* ── Arrows ── */
    .arrow { display: flex; flex-direction: column; align-items: center; position: relative; padding: 10px 0; }
    .arrow-line { width: 2px; height: 26px; background: #000; }
    .arrow-head {
      width: 0; height: 0;
      border-left: 8px solid transparent; border-right: 8px solid transparent;
      border-top: 10px solid #000;
    }
    .arrow-label {
      position: absolute; right: 50px; top: 50%; transform: translateY(-50%);
      font-size: 10px; color: #999; font-weight: 700; white-space: nowrap;
    }
    .arrow-right { display: flex; align-items: center; gap: 0; }
    .arrow-right .line { width: 30px; height: 2px; background: #000; }
    .arrow-right .head {
      width: 0; height: 0;
      border-top: 7px solid transparent; border-bottom: 7px solid transparent;
      border-left: 9px solid #000;
    }

    /* ── Row wrapper ── */
    .row { display: flex; align-items: center; gap: 20px; }
    .row-center { display: flex; flex-direction: column; align-items: center; gap: 14px; }

    /* ── Branch ── */
    .branch {
      display: flex; width: 100%; justify-content: space-between;
      position: relative; padding-top: 0;
    }
    .branch::before {
      content: ''; position: absolute; top: -2px; left: 25%; right: 25%;
      height: 3px; background: #000;
    }
    .branch-arm { display: flex; flex-direction: column; align-items: center; gap: 0; }
    .branch-arm .stem { width: 2px; height: 22px; background: #000; }

    .legend {
      display: flex; gap: 16px; margin-top: 36px;
      font-size: 11px; color: #888; font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="title">TalentriX — Architecture</div>
  <div class="sub">High-level system overview</div>

  <div class="canvas">

    <!-- Client -->
    <div class="row-center">
      <div class="box box-dark">
        <div class="box-title">Client</div>
        <div class="box-desc">React SPA (Vite) · browser</div>
      </div>
    </div>

    <!-- Arrow -->
    <div class="arrow">
      <div class="arrow-line"></div>
      <div class="arrow-head"></div>
      <div class="arrow-label">REST / JSON · JWT</div>
    </div>

    <!-- Server -->
    <div class="box">
      <div class="box-title">Server</div>
      <div class="box-desc">Express.js · Auth · API</div>
    </div>

    <!-- Arrow -->
    <div class="arrow">
      <div class="arrow-line"></div>
      <div class="arrow-head"></div>
      <div class="arrow-label">Mongoose ODM</div>
    </div>

    <!-- Database -->
    <div class="box">
      <div class="box-title">Database</div>
      <div class="box-desc">MongoDB</div>
    </div>

    <!-- Arrow → External -->
    <div class="arrow">
      <div class="arrow-line"></div>
      <div class="arrow-head"></div>
      <div class="arrow-label">APIs</div>
    </div>

    <!-- External services row -->
    <div class="branch">
      <div class="branch-arm">
        <div class="stem"></div>
        <div class="box" style="min-width:170px; padding:12px 20px;">
          <div class="box-title" style="font-size:14px;">Google OAuth</div>
        </div>
      </div>
      <div class="branch-arm">
        <div class="stem"></div>
        <div class="box" style="min-width:170px; padding:12px 20px;">
          <div class="box-title" style="font-size:14px;">Monnify</div>
          <div class="box-desc">Payments</div>
        </div>
      </div>
      <div class="branch-arm">
        <div class="stem"></div>
        <div class="box" style="min-width:170px; padding:12px 20px;">
          <div class="box-title" style="font-size:14px;">Job / Grant Feeds</div>
        </div>
      </div>
    </div>

    <div class="legend">
      <span>• 3 boxes = core stack</span>
      <span>• below = external services</span>
    </div>

  </div>

</body>
</html>
