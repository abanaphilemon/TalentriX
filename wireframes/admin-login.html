<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TalentriX — Admin Login Wireframe</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;">

  <div style="width:100%;max-width:420px;background:var(--surface);border-radius:20px;padding:36px;box-shadow:0 12px 40px rgba(0,0,0,.1);text-align:center;">

    <!-- Shield icon -->
    <div style="width:56px;height:56px;border-radius:14px;background:var(--text);margin:0 auto 16px;display:flex;align-items:center;justify-content:center;">
      <span style="color:#fff;font-size:26px;">🛡</span>
    </div>

    <h1 style="font-size:22px;font-weight:800;margin-bottom:4px;">Admin Access</h1>
    <p style="font-size:13px;color:var(--muted);margin-bottom:28px;">Sign in to manage the TalentriX site.</p>

    <!-- Fields -->
    <div style="text-align:left;display:flex;flex-direction:column;gap:16px;">
      <div>
        <div style="font-size:13px;font-weight:700;margin-bottom:6px;">Email</div>
        <div class="wf-field">📧  admin@talentriX.ai</div>
      </div>
      <div>
        <div style="font-size:13px;font-weight:700;margin-bottom:6px;">Password</div>
        <div class="wf-field">🔒  ••••••••</div>
      </div>
    </div>

    <div class="wf-btn wf-btn-primary" style="margin-top:22px;">Sign In  →</div>

    <div style="margin-top:20px;font-size:12px;color:var(--muted);font-weight:600;cursor:pointer;">
      ← Back to site
    </div>
  </div>

</body>
</html>
